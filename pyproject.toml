[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-tutor-edge"
version = "0.1.0"
description = "Local-first English tutor agent scaffold with Pydantic-AI, FastAPI, Gemini API, and llama.cpp switching"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI ChatGPT scaffold" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pydantic-ai>=1.0.0",
  "google-genai>=1.31.0",
  "openai>=1.40.0",
  "aiosqlite>=0.20.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.2",
  "httpx>=0.27.0",
  "typing-extensions>=4.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
