services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8009
      APP_DB_PATH: /app/data/gemma_tutor_edge.db
      APP_STORAGE_DIR: /app/data/storage
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://llama:8080/v1}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./README.md:/app/README.md:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "8009:8009"
    command: ["uvicorn", "gemma_tutor_edge.app:app", "--host", "0.0.0.0", "--port", "8009", "--reload"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: /app/web
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8009}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - api

volumes:
  web_node_modules:
