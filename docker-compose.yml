services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      LLAMA_GGUF_PATH: ${LLAMA_GGUF_PATH:-/models/gemma-4-E2B-it-Q4_K_M.gguf}
      LLAMA_MMPROJ_PATH: ${LLAMA_MMPROJ_PATH:-/models/mmproj-F16.gguf}
    volumes:
      - ${HOST_MODEL_DIR:-./models}:/models:ro
    ports:
      - "8080:8080"
    command:
      - -m
      - ${LLAMA_GGUF_PATH:-/models/gemma-4-E2B-it-Q4_K_M.gguf}
      - --mmproj
      - ${LLAMA_MMPROJ_PATH:-/models/mmproj-F16.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8009
      APP_DB_PATH: /app/data/gemma_tutor_edge.db
      APP_STORAGE_DIR: /app/data/storage
      LLM_BACKEND: ${LLM_BACKEND:-google}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://llama:8080/v1}
      LLAMA_MODEL: ${LLAMA_MODEL:-gemma-4-E2B-it-Q4_K_M.gguf}
      MODEL_DIR: ${MODEL_DIR:-/models}
      LLAMA_GGUF_PATH: ${LLAMA_GGUF_PATH:-/models/gemma-4-E2B-it-Q4_K_M.gguf}
      LLAMA_MMPROJ_PATH: ${LLAMA_MMPROJ_PATH:-/models/mmproj-F16.gguf}
      VALIDATE_LLAMA_ASSETS: ${VALIDATE_LLAMA_ASSETS:-false}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ${HOST_MODEL_DIR:-./models}:/models:ro
      - ./README.md:/app/README.md:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "8009:8009"
    command: ["uvicorn", "gemma_tutor_edge.app:app", "--host", "0.0.0.0", "--port", "8009", "--reload"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    working_dir: /app/web
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8009}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - api

volumes:
  web_node_modules:
